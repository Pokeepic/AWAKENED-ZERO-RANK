name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11 core
            python: "3.11"
            target: "."
          - name: Python 3.12 + Gymnasium
            python: "3.12"
            target: ".[training]"
          - name: Python 3.13 core
            python: "3.13"
            target: "."
          - name: Python 3.14 core
            python: "3.14"
            target: "."

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project
        run: python -m pip install -e "${{ matrix.target }}"

      - name: Compile sources
        run: python -m compileall -q src tests

      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -v
  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build frontend
        run: python -m pip install "build>=1,<2"

      - name: Build wheel and source archive
        run: python -m build

      - name: Create clean package environment
        run: python -m venv .package-venv

      - name: Install wheel without dependencies
        run: .package-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Verify installed CLI version
        run: .package-venv/bin/awakened-zero-rank --version

      - name: Test installed wheel
        run: .package-venv/bin/python -m unittest discover -s tests -v
