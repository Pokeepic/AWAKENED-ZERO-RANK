[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awakened-zero-rank"
version = "0.141.0"
description = "Observer-only autonomous life simulation set in awakened Japan"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["simulation", "autonomous-agent", "reinforcement-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Pokeepic/AWAKENED-ZERO-RANK"
Changelog = "https://github.com/Pokeepic/AWAKENED-ZERO-RANK/blob/main/CHANGELOG.md"

[project.optional-dependencies]
training = ["gymnasium>=1.0,<2"]
[project.scripts]
awakened-zero-rank = "awakened_zero_rank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
