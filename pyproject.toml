[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awakened-zero-rank"
version = "0.217.0"
description = "Observer-only autonomous life simulation set in awakened Japan"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["simulation", "autonomous-agent", "reinforcement-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Pokeepic/AWAKENED-ZERO-RANK"
Changelog = "https://github.com/Pokeepic/AWAKENED-ZERO-RANK/blob/main/CHANGELOG.md"

[project.optional-dependencies]
training = ["gymnasium>=1.0,<2"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
awakened-zero-rank = "awakened_zero_rank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
