[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awakened-zero-rank"
version = "0.33.0"
description = "Observer-only autonomous life simulation set in awakened Japan"
requires-python = ">=3.11"

[project.optional-dependencies]
training = ["gymnasium>=1.0,<2"]
[project.scripts]
awakened-zero-rank = "awakened_zero_rank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
